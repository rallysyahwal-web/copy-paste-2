<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1117">
  <meta name="robots" content="noindex, nofollow">
  <title>Salin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1117;
      --panel: #151a23;
      --line: #232a37;
      --text: #e9ecf2;
      --muted: #8b93a5;
      --accent: #9db8ff;
      --accent-ink: #0e1117;
      --danger: #ff9a9a;
      --ok: #7fd8a6;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    main { max-width: 720px; margin: 0 auto; padding: 28px 18px 80px; }

    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .status.on::before { background: var(--ok); }
    .status.off::before { background: var(--danger); }

    .composer {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      transition: border-color .15s, box-shadow .15s;
    }
    .composer:focus-within {
      border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 12%, transparent);
    }
    textarea {
      display: block; width: 100%; min-height: 110px; max-height: 40vh;
      resize: vertical; border: 0; outline: 0; background: transparent;
      color: var(--text); font: inherit; padding: 4px 4px 10px;
    }
    textarea::placeholder { color: var(--muted); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .actions .spacer { flex: 1; }

    button {
      font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      border-radius: 10px; padding: 9px 14px; border: 1px solid var(--line);
      background: transparent; color: var(--text); min-height: 40px;
      transition: background .15s, border-color .15s, opacity .15s;
    }
    button:hover { background: #1b2230; }
    button:disabled { opacity: .5; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    button.primary:hover { background: #b3c8ff; }
    button.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); }
    button.quiet { border-color: transparent; color: var(--muted); }
    button.quiet:hover { color: var(--text); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .hint { margin: 12px 4px 0; font-size: 13px; color: var(--muted); }

    #list { margin-top: 28px; }
    .empty { color: var(--muted); text-align: center; padding: 48px 12px; }

    .item { padding: 18px 2px; border-top: 1px solid var(--line); }
    .item:first-child { border-top: 0; }
    .text {
      margin: 0; white-space: pre-wrap; word-break: break-word; cursor: pointer;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden;
    }
    .text.open { -webkit-line-clamp: unset; display: block; }
    .thumb {
      display: block; max-width: 100%; max-height: 220px; object-fit: contain;
      border-radius: 12px; background: var(--panel); cursor: zoom-in;
    }
    .thumb.open { max-height: none; cursor: zoom-out; }
    .file { display: flex; flex-direction: column; }
    .file b { font-weight: 600; word-break: break-all; }
    .file span { color: var(--muted); font-size: 13px; }

    .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .foot time { color: var(--muted); font-size: 13px; }
    .btns { display: flex; gap: 8px; }

    .drop {
      position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
      background: rgba(14, 17, 23, .88); backdrop-filter: blur(4px);
      font-size: 20px; font-weight: 600;
    }
    .drop.show { display: flex; }
    .drop div { border: 2px dashed var(--accent); border-radius: 20px; padding: 48px 56px; }

    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 30;
      transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
      background: #222a39; border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 16px; font-size: 14px; max-width: calc(100% - 32px); text-align: center;
      transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    @media (max-width: 480px) {
      main { padding-top: 20px; }
      .actions button { flex: 1 1 auto; }
      .actions .spacer { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Salin</h1>
      <span id="status" class="status">Menghubungkan…</span>
    </header>

    <section class="composer">
      <textarea id="text" placeholder="Ketik atau tempel teks di sini" aria-label="Teks yang mau dikirim"></textarea>
      <div class="actions">
        <button id="pasteBtn" type="button">Tempel &amp; kirim</button>
        <button id="fileBtn" type="button">Pilih file</button>
        <span class="spacer"></span>
        <button id="sendBtn" type="button" class="primary">Kirim</button>
      </div>
      <input id="fileInput" type="file" multiple hidden>
    </section>
    <p class="hint">Tekan Ctrl+V di mana saja untuk menempel gambar, atau seret file ke halaman ini. Ctrl+Enter untuk mengirim teks.</p>

    <section id="list" aria-live="polite"></section>
  </main>

  <div id="drop" class="drop"><div>Lepas file untuk mengirim</div></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
