<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12151c">
<title>Transfer</title>
<style>
:root{color-scheme:dark;--bg:#12151c;--sf:#1a1f2a;--ln:#2a3140;--tx:#e6e9ef;--mu:#8b93a3;--ac:#8fb0ff;--rd:#ff8a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
main{max-width:680px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em}
#peer{font-size:13px;color:var(--mu)}#peer.on{color:var(--ac)}
.box,article{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}
textarea{width:100%;min-height:96px;resize:vertical;background:transparent;border:0;color:var(--tx);font:inherit;outline:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button,select{font:inherit;font-size:14px;color:var(--tx);background:#232a37;border:1px solid var(--ln);border-radius:9px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--ac);color:#0c1220;border-color:var(--ac);font-weight:600}
button.del{color:var(--rd)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.opt{font-size:13px;color:var(--mu);gap:16px}.opt select{padding:4px 8px;font-size:13px}
progress{width:100%;margin-top:10px;accent-color:var(--ac)}
#list,#rx{display:grid;gap:10px;margin-top:12px}
article pre{margin:0 0 10px;white-space:pre-wrap;word-break:break-word;font:inherit}
article img{max-width:100%;max-height:320px;border-radius:8px;display:block;margin-bottom:10px}
article a{color:var(--ac);word-break:break-all}
small{display:block;color:var(--mu);font-size:12px;margin-bottom:6px}
#empty{text-align:center;color:var(--mu);margin-top:32px}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header><h1>Transfer</h1><span id="peer">Perangkat lain offline</span></header>
  <section class="box">
    <textarea id="txt" placeholder="Tulis atau tempel teks. Gambar: tekan Ctrl+V atau seret ke halaman ini."></textarea>
    <div class="row">
      <button id="st" class="pri">Kirim teks</button>
      <button id="sf">Pilih file</button>
      <button id="p2p" disabled title="Butuh perangkat lain yang membuka halaman ini">Kirim langsung</button>
    </div>
    <div class="row opt">
      <label><input type="checkbox" id="cmp" checked> Kompres gambar</label>
      <label>Hapus otomatis
        <select id="ttl"><option value="0">Tidak</option><option value="3600">1 jam</option><option value="86400">1 hari</option><option value="604800">7 hari</option><option value="2592000">30 hari</option></select>
      </label>
    </div>
    <progress id="pg" max="1" hidden></progress>
  </section>
  <div id="rx"></div>
  <div id="list"></div>
  <p id="empty" hidden>Belum ada kiriman. Kirim teks atau file dari perangkat mana pun.</p>
</main>
<div id="toast" hidden></div>
<input type="file" id="fi" multiple hidden>
<input type="file" id="di" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
